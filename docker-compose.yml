# Temu — stack production & dev. Hanya SATU port dipublish ke host: app di
# 127.0.0.1:${APP_PORT} (default 8093); nginx host / Cloudflare yang menghadap internet.
#
# Nama project dikunci supaya nama volume (temu_pgdata) tidak bergantung pada nama folder clone.
name: temu

services:
  app:
    build: .
    container_name: temu-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://temu:${DB_PASSWORD:-temu}@db:5432/temu?sslmode=disable
    ports:
      - "127.0.0.1:${APP_PORT:-8093}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [temu-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  db:
    image: postgres:16-alpine
    container_name: temu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: temu
      # Hanya berlaku saat volume pgdata pertama kali dibuat (lihat DEPLOY.md).
      POSTGRES_PASSWORD: ${DB_PASSWORD:-temu}
      POSTGRES_DB: temu
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Hanya localhost; DB_HOST_PORT kosong = Docker memilih port acak. Tanda `-` tunggal disengaja.
      - "127.0.0.1:${DB_HOST_PORT-}:5432"
    networks: [temu-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temu -d temu"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  temu-network:
    driver: bridge

volumes:
  pgdata:
